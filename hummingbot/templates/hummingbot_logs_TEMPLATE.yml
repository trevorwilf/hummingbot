---
version: 1
template_version: 14

formatters:
    simple:
        format: "%(asctime)s - %(process)d - %(name)s - %(levelname)s - %(message)s"
    forensic:
        format: "%(asctime)s - %(process)d - %(name)s:%(funcName)s:%(lineno)d - %(levelname)s - %(message)s"
        datefmt: "%Y-%m-%dT%H:%M:%S"
    structured:
        format: "%(message)s"

handlers:
    console:
        class: hummingbot.logger.cli_handler.CLIHandler
        level: INFO
        formatter: simple
        stream: ext://sys.stdout
    console_warning:
        class: hummingbot.logger.cli_handler.CLIHandler
        level: WARNING
        formatter: simple
        stream: ext://sys.stdout
    console_info:
        class: hummingbot.logger.cli_handler.CLIHandler
        level: INFO
        formatter: simple
        stream: ext://sys.stdout
    file_handler:
        class: logging.handlers.TimedRotatingFileHandler
        level: DEBUG
        formatter: simple
        filename: $PROJECT_DIR/logs/logs_$STRATEGY_FILE_PATH.log
        encoding: utf8
        when: "D"
        interval: 1
        backupCount: 14
    forensic_file_handler:
        class: logging.handlers.TimedRotatingFileHandler
        level: DEBUG
        formatter: forensic
        filename: $PROJECT_DIR/logs/forensics_$STRATEGY_FILE_PATH.log
        encoding: utf8
        when: "D"
        interval: 1
        backupCount: 30
    structured_file_handler:
        class: logging.handlers.RotatingFileHandler
        level: INFO
        formatter: structured
        filename: $PROJECT_DIR/logs/structured_events.jsonl
        maxBytes: 52428800
        backupCount: 5
    errors_file_handler:
        class: logging.handlers.RotatingFileHandler
        level: ERROR
        formatter: forensic
        filename: $PROJECT_DIR/logs/errors.log
        maxBytes: 10485760
        backupCount: 5
        encoding: utf8
    "null":
        class: logging.NullHandler
        level: DEBUG

loggers:
    hummingbot.core.utils.eth_gas_station_lookup:
        level: NETWORK
        propagate: false
        handlers: [console, file_handler]
        mqtt: true
    hummingbot.logger.log_server_client:
        level: WARNING
        propagate: false
        handlers: [console, file_handler]
        mqtt: true
    hummingbot.logger.reporting_proxy_handler:
        level: WARNING
        propagate: false
        handlers: [console, file_handler]
        mqtt: true
    hummingbot.strategy:
        level: NETWORK
        propagate: false
        handlers: [console, file_handler]
        mqtt: true
    hummingbot.connector:
        level: NETWORK
        propagate: false
        handlers: [console, file_handler]
        mqtt: true
    hummingbot.client:
        level: NETWORK
        propagate: false
        handlers: [console, file_handler]
        mqtt: true

    # ---- strategy_v2 instrumentation (forensic-enabled) ----
    hummingbot.strategy.strategy_v2_base:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true
    hummingbot.strategy_v2:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true
    hummingbot.strategy_v2.controllers:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true
    hummingbot.strategy_v2.executors:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true

    # ---- budget / balance instrumentation ----
    hummingbot.connector.budget_checker:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true
    hummingbot.connector.client_order_tracker:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true

    # ---- connector-specific forensic logging ----
    hummingbot.connector.exchange.nonkyc:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true
    hummingbot.connector.exchange.mexc:
        level: DEBUG
        propagate: false
        handlers: [console_info, file_handler, forensic_file_handler]
        mqtt: true

    # ---- throttler / transport (forensic only) ----
    hummingbot.core.api_throttler:
        level: DEBUG
        propagate: false
        handlers: [file_handler, forensic_file_handler]
        mqtt: false

    hummingbot.structured_events:
        level: INFO
        handlers: [forensic_file_handler, structured_file_handler]
        propagate: no
    hummingbot.core.event.event_reporter:
        level: EVENT_LOG
        propagate: false
        handlers: [file_handler]
        mqtt: false
    conf:
        level: NETWORK
        handlers: ["null"]
        propagate: false
        mqtt: false

root:
    level: INFO
    handlers: [console, file_handler, errors_file_handler]
    mqtt: true
