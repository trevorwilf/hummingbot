id: range_inventory_ladder_xmr_V1
controller_name: range_inventory_ladder
controller_type: market_making

connector_name: nonkyc
trading_pair: XMR-USDT

total_amount_quote: 600
allow_initialize_with_unavailable_wallet_funds: true
max_fund_value_quote: 5000

# Fund new orders from THIS controller's own managed-fund ledger (owned_quote/owned_base minus its
# resting reservations), wallet-floored. Lets multiple controllers share one exchange account
# WITHOUT shared_account_quote_quota. Set false for legacy raw-wallet-funded behavior.
ledger_funded_budgets: true

use_wallet_balance: true
claimed_base_value_quote: 300

buy_prices: 327,324,321,318,315,312,305
buy_amounts_pct: 0.5,1, 1, 4, 3.5, 1, 0.5

sell_prices: 331.5,337,340,345,350,355,360,370,380
sell_amounts_pct: 0.5,1,1,2,2,1,1,1,1

# Per-side cooldown + immediate cross-side refresh model.
#  - event_refresh_enabled=true (default): a fill on one side immediately refreshes the OPPOSITE
#    ladder (deploying the new proceeds, no 12h latency) and resets that side's cooldown; each side
#    re-centers only after ITS cooldown lapses with no fill; executor_refresh_time is now a GLOBAL
#    periodic refresh of BOTH sides (independent of fills/cooldowns).
#  - Set event_refresh_enabled=false to revert to the legacy per-executor-age refresh.
event_refresh_enabled: true
executor_refresh_time: 43200
cooldown_time: 3600
# buy_cooldown_time / sell_cooldown_time default to cooldown_time when omitted.
# buy_cooldown_time: 3600
# sell_cooldown_time: 3600
min_order_quote: 1
allow_partial_levels: true
passive_order_placement: true

# v11 unattended-run safety / diagnostics
max_session_duration_hours: 660
cancel_orders_on_session_end: true
max_market_data_unavailable_seconds: 900
cancel_orders_on_market_data_hard_pause: true
diagnostic_log_enabled: true
diagnostic_log_file_name: range_inventory_ladder_xmr_usdt_diagnostic.jsonl
diagnostic_heartbeat_interval_seconds: 300

state_file_name: range_inventory_ladder_xmr_usdt.json
manual_kill_switch: false
