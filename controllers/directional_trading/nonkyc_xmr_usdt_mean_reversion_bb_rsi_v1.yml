# filename: conf/controllers/nonkyc_xmr_usdt_mean_reversion_bb_rsi_v1.yml
# for:
#  - filename: controllers/directional_trading/ema_regime_hold_v1.py
#  - filename: controllers/directional_trading/mean_reversion_bb_rsi_v1.py
# custom script for trading XMR-USDT on nonkyc connector

id: nonkyc_xmr_usdt_mr_bb_rsi_v1
controller_name: mean_reversion_bb_rsi_v1
controller_type: directional_trading

connector_name: nonkyc
trading_pair: XMR-USDT

total_amount_quote: "300"
manual_kill_switch: false
initial_positions: []

max_executors_per_side: 1
cooldown_time: 3600

leverage: 1          # spot: ignored at runtime (only used for perpetuals)
position_mode: ONEWAY  # spot: ignored at runtime (only used for perpetuals)

stop_loss: "0.04"
take_profit: "0.03"
time_limit: 172800
take_profit_order_type: LIMIT
trailing_stop: ""

candles_connector: ""
candles_trading_pair: ""
interval: "5m"

bb_length: 80
bb_std: 2.0
bbp_entry_threshold: 0.20

rsi_length: 14
rsi_entry_threshold: 40.0

use_trend_filter: true
trend_ema_length: 200
min_trend_slope: 0.0

atr_length: 14
max_atr_pct_for_entry: 0.10

volume_filter_window: 288
min_volume_quantile: 0.30

max_spread_pct: 0.006
max_trades_per_day: 6
